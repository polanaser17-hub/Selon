<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S E L O N</title>
    <link rel="icon" href="../Images/Selon-logo.webp" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../Style.css">
    <title>Document</title>
</head>

<body>


    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container d-flex justify-content-center">


            <a class="navbar-brand mb-0 d-flex align-items-center gap-2" href="index.html">


                <span class="fw-semibold fs-4">
                    S E L O N
                </span>

                <img src="../Images/Selon-logo-removebg-preview.webp" alt="SELON Logo"
                    style="width: 45px; height: 45px; object-fit: contain;">

            </a>


            <!-- Mobile Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <i class="fa-solid fa-bars"></i>
            </button>


        </div>
    </nav>


    <div class="container checkout-row">
        <div class="row align-items-start justify-content-between">

            <div class="col-lg-5 bg-ls-co p-4 rounded-4 cart-column">
                <h5 class="fw-bold mb-3">Your Cart</h5>
                <hr>
                <div id="detailscontainer"></div>
                <h5 class="mt-3">Total: <span id="totalprice">0</span> EGP</h5>
            </div>

            <div class="col-lg-6 bg-ls-co p-4 rounded-4">
                <div class="checkout-wrap">

                    <!-- تواصل -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0">Contact</h4>
                    </div>

                    <div class="floating-box">
                        <label class="field-label">Email</label>
                        <input type="email" value="" id="email">
                    </div>

                    <br>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0">Shipping Information</h4>
                    </div>
                    <div class="floating-box">
                        <label class="field-label">Country</label>
                        <select id="country">
                            <option selected>Egypt</option>
                        </select>
                    </div>

                    <div class="row-2">
                        <div class="floating-box">
                            <label class="field-label">First Name</label>
                            <input type="text" value="" id="lastname">
                        </div>
                        <div class="floating-box">
                            <label class="field-label">Last Name</label>
                            <input type="text" value="" id="firstname">
                        </div>
                    </div>

                    <div class="floating-box">
                        <label class="field-label">Address</label>
                        <input type="text" value="" id="address">
                    </div>

                    <div class="floating-box">
                        <label class="field-label">Details</label>
                        <input type="text" value="" id="details">
                    </div>

                    <div class="row-2">
                        <div class="floating-box">
                            <label class="field-label">City</label>
                            <input type="text" value="" id="city">
                        </div>
                        <div class="floating-box">
                            <label class="field-label">Government</label>
                            <select id="government">
                                <option selected>Assiut</option>
                                <option selected>Kafr Elshiekh</option>
                                <option selected>Al minia</option>
                                <option selected>Alexandria</option>
                                <option selected>Giza</option>
                                <option selected>Cairo</option>

                            </select>
                        </div>
                        <div class="floating-box">
                            <label class="field-label">postalcode</label>
                            <input type="number" value="" id="postalcode">
                        </div>
                    </div>

                    <div class="phone-box">
                        <i class="fa-solid fa-chevron-down text-muted"></i>
                        <span class="flag">🇪🇬</span>
                        <i class="fa-regular fa-circle-question text-muted"></i>
                        <input type="number" id="phone">
                    </div>

                    <div class="checkbox-line">
                        <input class="form-check-input" type="checkbox">

                        <label>Save This Information for the next time</label>
                    </div>
                    <div class="checkbox-line">
                        <input class="form-check-input" type="checkbox">
                        <label>Text me with news and offers</label>
                    </div>

                    <!-- الدفع -->
                    <h5 class="section-title">Payment</h5>

                    <div class="option-row ">
                        <div class="option-left">
                            <input class="form-check-input" type="radio" name="payment" value="Cash on Delivery">
                            <span>Cash On Delivery (COD)</span>
                        </div>
                    </div>

                    <div class="option-row">
                        <div class="option-left">
                            <input class="form-check-input" type="radio" name="payment" value="Vodafone Cash">
                            <span>Vodafone Cash</span>
                        </div>
                    </div>

                    <div class="option-row">
                        <div class="option-left">
                            <input class="form-check-input" type="radio" name="payment" value="Instapay">
                            <span>Instapay</span>
                        </div>
                    </div>

                    <button type="button" class="btn-complete mt-3 mb-5" id="completeOrder">Complete Order</button>

                </div>
            </div>
        </div>
        <br>
    </div>

    <div id="orderSuccessOverlay" class="order-success-overlay">
        <div class="order-success-box">
            <div class="success-icon">✅</div>
            <h2>"Your order has been successfully submitted for review"</h2>
            <p>we will contact you soon</p>
            <button id="closeSuccessOverlay">Continue Shopping</button>
        </div>
    </div>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
    <script src="../checkout.js"></script>
    <script src="../cartdetails.js"></script>
    <script src="../nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
